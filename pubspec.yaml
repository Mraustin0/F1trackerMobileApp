name: flutter_application_1
description: "F1 Tracker - Formula 1 Motorsport Companion App"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.3

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^2.6.1

  # HTTP client
  dio: ^5.7.0

  # Navigation
  go_router: ^14.6.2

  # Firebase (FCM push notifications)
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3

  # Local notification display (foreground FCM)
  flutter_local_notifications: ^18.0.0

  # Timezone conversion
  timezone: ^0.9.4

  # Local offline cache
  hive_flutter: ^1.1.0

  # Fonts (Space Grotesk + Inter)
  google_fonts: ^6.2.1

  # Shimmer skeleton loading
  shimmer: ^3.0.0

  # Cached network images
  cached_network_image: ^3.4.1

  # Offline detection
  connectivity_plus: ^6.1.0

  # Home screen widget bridge
  home_widget: ^0.7.0

  # Native calendar integration
  device_calendar: ^4.3.0

  # Date/number formatting
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # Hive code generation
  hive_generator: ^2.0.1
  build_runner: ^2.4.12

flutter:
  uses-material-design: true

  assets:
    - assets/circuits/
